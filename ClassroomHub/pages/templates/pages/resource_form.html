
{% extends "pages/base.html" %}

{% block title %}Manage resource | ClassroomHub{% endblock %}

{% block content %}
    <h2>Manage resource</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.non_field_errors }}
        {{ form.as_p }}

        <button type="submit">Save resource</button>
    </form>

    <a href="{% url 'pages:resources' %}">Cancel</a>
{% endblock %}
